<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Hydroponic Dashboard</title>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Socket.io Client -->
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    h1 {
      text-align: center;
      margin-bottom: 5px;
    }
    .status-container {
      text-align: center;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 20px;
    }
    .status-online { color: #2ecc71; }
    .status-offline { color: #e74c3c; }
    
    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .tab-btn {
      padding: 10px 20px;
      border: none;
      background-color: #e0e0e0;
      cursor: pointer;
      border-radius: 5px;
      font-weight: bold;
    }
    .tab-btn.active {
      background-color: #3498db;
      color: white;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      max-width: 1000px;
      margin: 0 auto 20px auto;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .card h3 { margin-top: 0; color: #666; font-size: 16px; }
    .card .val { font-size: 28px; font-weight: bold; margin: 10px 0; }

    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }
    .chart-card {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
  </style>
</head>
<body>

  <h1>Smart Hydroponic Dashboard</h1>
  <div class="status-container">
    Status Koneksi Server: <span id="status-text" class="status-offline">● Menghubungkan...</span>
  </div>

  <div class="nav-tabs">
    <button class="tab-btn active">Slide 1: Real-Time Sensor</button>
    <button class="tab-btn">Slide 2: Kontrol Pompa</button>
    <button class="tab-btn">Slide 3: Riwayat Data</button>
  </div>

  <!-- Cards -->
  <div class="cards-grid">
    <div class="card">
      <h3>Suhu Air</h3>
      <div class="val" id="val-temp">0 °C</div>
    </div>
    <div class="card">
      <h3>Nilai pH</h3>
      <div class="val" id="val-ph">0</div>
    </div>
    <div class="card">
      <h3>Pekatan EC</h3>
      <div class="val" id="val-ec">0 mS/cm</div>
    </div>
  </div>

  <!-- Charts -->
  <div class="charts-grid">
    <div class="chart-card">
      <canvas id="chartTemp"></canvas>
    </div>
    <div class="chart-card">
      <canvas id="chartPH"></canvas>
    </div>
    <div class="chart-card">
      <canvas id="chartEC"></canvas>
    </div>
  </div>

  <script>
    // Inisialisasi Socket.io secara dinamis sesuai domain hosting
    const socket = io();

    const statusText = document.getElementById('status-text');

    socket.on('connect', () => {
      statusText.className = 'status-online';
      statusText.innerText = '● ONLINE (Server Terhubung)';
    });

    socket.on('disconnect', () => {
      statusText.className = 'status-offline';
      statusText.innerText = '● OFFLINE (Terputus)';
    });

    // Inisialisasi Chart.js
    const ctxTemp = document.getElementById('chartTemp').getContext('2d');
    const ctxPH = document.getElementById('chartPH').getContext('2d');
    const ctxEC = document.getElementById('chartEC').getContext('2d');

    const configChart = (label, color) => ({
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          label: label,
          data: [],
          borderColor: color,
          borderWidth: 2,
          fill: false,
          tension: 0.2
        }]
      },
      options: {
        responsive: true,
        scales: {
          x: { display: true, title: { display: true, text: 'Waktu' } },
          y: { beginAtZero: true }
        }
      }
    });

    const chartTemp = new Chart(ctxTemp, configChart('Suhu (°C)', '#e74c3c'));
    const chartPH = new Chart(ctxPH, configChart('pH', '#3498db'));
    const chartEC = new Chart(ctxEC, configChart('EC (mS/cm)', '#2ecc71'));

    // Menerima Data Sensor dari Server via Socket.io
    socket.on('sensorData', (data) => {
      const now = new Date().toLocaleTimeString();

      if (data.temp !== undefined) {
        document.getElementById('val-temp').innerText = `${data.temp} °C`;
        updateChart(chartTemp, now, data.temp);
      }
      if (data.ph !== undefined) {
        document.getElementById('val-ph').innerText = data.ph;
        updateChart(chartPH, now, data.ph);
      }
      if (data.ec !== undefined) {
        document.getElementById('val-ec').innerText = `${data.ec} mS/cm`;
        updateChart(chartEC, now, data.ec);
      }
    });

    function updateChart(chart, time, val) {
      chart.data.labels.push(time);
      chart.data.datasets[0].data.push(val);
      if (chart.data.labels.length > 10) {
        chart.data.labels.shift();
        chart.data.datasets[0].data.shift();
      }
      chart.update();
    }
  </script>
</body>
</html>
